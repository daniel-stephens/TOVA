[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corpus-generation-agent"
version = "0.1.0"
description = "Synthetic email corpus generation agent"
authors = [
    {name = "Juan F. Fung", email = "juan.fung@nist.gov"}
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "openai>=1.30.0",
    "pydantic>=2.0",
    "corpus-state-mcp",
]

[tool.uv.sources]
corpus-state-mcp = { path = "packages/corpus_state", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_agent"]

[tool.pytest.ini_options]
testpaths = ["src/corpus_agent/tests", "packages/corpus_state/tests"]
asyncio_mode = "auto"
